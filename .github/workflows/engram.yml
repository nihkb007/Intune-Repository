name: ENGRAM build

on:
  push:
    paths: ['engram/**', 'engram-web/**', '.github/workflows/engram.yml']
  pull_request:
    paths: ['engram/**', 'engram-web/**', '.github/workflows/engram.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: engram

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: engram/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        with: { name: screenshots, path: engram/docs/screenshots }

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: engram/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Web setup command on real Windows (PowerShell 5.1 + 7)
        working-directory: engram-web
        run: npm ci && npm test
      - name: Build installer + portable zip
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Optional repo variable (Settings -> Secrets and variables -> Actions -> Variables):
          # e.g. \\NAS\engram. When set, the portable zip ships pre-linked to that folder.
          ENGRAM_LINK_FOLDER: ${{ vars.ENGRAM_LINK_FOLDER }}
      - name: Checksums
        shell: pwsh
        run: Get-ChildItem dist -File | Where-Object Name -match '\.(exe|zip)$' | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ENGRAM-windows
          path: |
            engram/dist/ENGRAM-Setup-*.exe
            engram/dist/ENGRAM-Portable-*.zip
            engram/dist/SHA256SUMS.txt
      - name: Replace previous download
        if: github.event_name != 'pull_request'
        run: gh release delete engram-latest --cleanup-tag --yes; exit 0
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
      # One stable download page: https://github.com/<owner>/<repo>/releases/tag/engram-latest
      - name: Publish download (pre-release)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: engram-latest
          target_commitish: ${{ github.sha }}
          name: ENGRAM (latest Windows build)
          prerelease: true
          body: |
            Windows builds of ENGRAM from commit ${{ github.sha }}.
            - **ENGRAM-Portable-*.zip**: no install. Extract anywhere and run ENGRAM.exe. Data stays in ENGRAM-data\ next to it.
            - **ENGRAM-Setup-*.exe**: guided installer with Start Menu/desktop shortcuts.
            Unsigned: SmartScreen may say "Windows protected your PC". Click More info, then Run anyway.
            Full instructions: engram/docs/WINDOWS.md
          files: |
            engram/dist/ENGRAM-Setup-*.exe
            engram/dist/ENGRAM-Portable-*.zip
            engram/dist/SHA256SUMS.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engram-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: engram-web/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Build and test in Chrome
        run: npm run test:e2e
        env: { CHROMIUM_PATH: /usr/bin/google-chrome }

  # Deploys the portal to Vercel on every push. Needs repository secrets (Settings →
  # Secrets and variables → Actions): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, and
  # optionally ENGRAM_USERS + ENGRAM_SESSION_SECRET (from `npm run make-user`) for the login.
  # Without them the job just says so and succeeds.
  vercel:
    needs: [test, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: . # the secrets check runs before checkout, so not engram/
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }} # optional: looked up from the project
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_1oEZw1pHnMC80757j6NlNZf4ThJM' }}
    steps:
      - id: check
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::VERCEL_TOKEN secret not set yet: skipping deploy (see engram-web/README.md)"; fi
      - if: steps.check.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.go == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Configure Vercel project + login variables
        if: steps.check.outputs.go == 'true'
        run: node engram-web/tools/vercel-setup.mjs
        env:
          ENGRAM_USERS: ${{ secrets.ENGRAM_USERS }}
          ENGRAM_SESSION_SECRET: ${{ secrets.ENGRAM_SESSION_SECRET }}
      - name: Build and deploy (production)
        if: steps.check.outputs.go == 'true'
        # Vercel builds it (install/build from engram-web/vercel.json). `vercel pull` and
        # `vercel build` stop when the token can't read the team itself; `deploy` doesn't.
        run: |
          url=$(npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Deployed: $url" | tee -a "$GITHUB_STEP_SUMMARY"
